name: Build Drain Artifacts

# On-demand build of the emergency-drain binaries. Deliberately NOT tied to any
# release: the drain client is a dedicated, temporary build operators run only for
# the drain window (RFC 002), so it is produced here, never shipped in a release.
#
# One run produces, cross-compiled for the signer hosts (linux amd64 + arm64):
#   - zetaclientd-drain  from CLIENT_REF (default release/zetaclient/v38),
#       built with `-tags pebbledb,ledger,drain` → the drain CLIENT (matches the
#       version the signers run so the go-tss ceremony/state is compatible).
#   - zetatool           from SERVER_REF (default main), built normally → the
#       drain SERVER (`zetatool drain-payload --serve`), where the subcommand +
#       receiver anchors live.
#
# Triggerable by manual dispatch, or by pushing a `drain-build/**` branch (so it
# can be produced from the v38 branch without the main-branch dispatch registration).
# Nothing here deploys, arms, or moves funds — it only emits binaries as artifacts.

on:
  workflow_dispatch:
    inputs:
      client_ref:
        description: 'Ref for the drain client (zetaclientd)'
        required: false
        type: string
        default: 'release/zetaclient/v38'
      server_ref:
        description: 'Ref for the server (zetatool)'
        required: false
        type: string
        default: 'main'
  push:
    branches: ['drain-build/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      CLIENT_REF: ${{ inputs.client_ref || 'release/zetaclient/v38' }}
      SERVER_REF: ${{ inputs.server_ref || 'main' }}
    steps:
      - name: Checkout client ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CLIENT_REF }}
          path: client

      - name: Checkout server ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SERVER_REF }}
          path: server

      # Cross-compile inside the SAME pinned goreleaser-cross image the real
      # zetaclientd releases use (Makefile GORELEASER / .goreleaser-zetaclient.yaml),
      # instead of bare `apt-get install gcc-aarch64-linux-gnu` on whatever glibc
      # ubuntu-latest happens to ship that week. The prior version of this workflow
      # built on plain ubuntu-latest and produced a binary requiring GLIBC_2.38,
      # which the signer hosts don't have -- zetaclientd failed at the dynamic
      # linker before main() ever ran, so it silently never armed the drain poller.
      # This is exactly the toolchain that already produces the binaries running
      # successfully on those same hosts today.
      - name: Write build script
        run: |
          cat > build.sh <<'SCRIPT'
          set -euo pipefail
          ARCH="$1"
          if [ "$ARCH" = "arm64" ]; then CC=aarch64-linux-gnu-gcc; CXX=aarch64-linux-gnu-g++; else CC=x86_64-linux-gnu-gcc; CXX=x86_64-linux-gnu-g++; fi
          export CGO_ENABLED=1 GOOS=linux GOARCH="$ARCH" CC CXX
          # Only the DBBackend ldflag is functional; the rest is version cosmetics.
          LDBASE="-X github.com/cosmos/cosmos-sdk/types.DBBackend=pebbledb -s -w"
          mkdir -p dist

          echo "--> zetaclientd (drain) linux/${ARCH}"
          ( cd client && go build -tags pebbledb,ledger,drain \
              -ldflags "$LDBASE -X github.com/zeta-chain/node/pkg/constant.CommitHash=$(git rev-parse --short HEAD)" \
              -o "../dist/zetaclientd-drain-linux-${ARCH}" ./cmd/zetaclientd )

          echo "--> zetatool linux/${ARCH}"
          ( cd server && go build -tags pebbledb,ledger \
              -ldflags "$LDBASE -X github.com/zeta-chain/node/pkg/constant.CommitHash=$(git rev-parse --short HEAD)" \
              -o "../dist/zetatool-linux-${ARCH}" ./cmd/zetatool )
          SCRIPT

      - name: Build (goreleaser-cross v1.22.7, same image release-template.yml uses)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          # goreleaser-cross's image ENTRYPOINT is the goreleaser binary itself, so a plain
          # `docker run <image> bash build.sh` gets parsed as `goreleaser bash build.sh` --
          # override it to actually get a shell.
          docker run --rm \
            --entrypoint bash \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ghcr.io/goreleaser/goreleaser-cross:v1.22.7@sha256:24b2d75007f0ec8e35d01f3a8efa40c197235b200a1a91422d78b851f67ecce4 \
            build.sh "${ARCH}"

          ( cd dist && sha256sum * > "SHA256SUMS-${ARCH}.txt" && cat "SHA256SUMS-${ARCH}.txt" )

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drain-binaries-${{ matrix.arch }}
          path: dist/*
